name: Watch upstream

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

concurrency:
  # Prevents two runs (e.g. the daily cron firing while someone manually
  # dispatches) from racing each other's git push/deploy-dispatch — same
  # class of issue found in deploy.yml. Queue rather than cancel: a
  # half-finished content generation shouldn't be killed mid-write.
  group: watch-upstream
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # actions: write lets _auto-publish.ts trigger deploy.yml directly — pushes made
      # with GITHUB_TOKEN don't fire other workflows' `on: push` triggers, so deploy
      # would otherwise never run after an autonomous content publish.
      actions: write
      # issues: write is for the failure-tracking step at the end of this job.
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Configure git identity for automated commits
        run: |
          git config user.name "claude-code-learn-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Detect upstream changes
        id: diff
        run: npm run watch:upstream
      - name: Generate and publish update
        if: steps.diff.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_VERSION: ${{ steps.diff.outputs.latest_version }}
        run: npm run generate:update
      - name: Open or update a tracking issue on failure
        # This is how you actually find out something broke, beyond GitHub's
        # own (easy-to-miss) email notifications — a persistent, visible
        # issue instead of a run that quietly turns red in a tab nobody has
        # open. Dedupes on title so a recurring daily failure updates one
        # issue with a new comment instead of opening a new one every day.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🔴 ${{ github.workflow }} failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Run failed: $RUN_URL
          Commit: ${{ github.sha }}
          Triggered by: ${{ github.event_name }}"
          EXISTING=$(gh issue list --label "automation-failure" --state open --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "automation-failure" --body "$BODY"
          fi
