name: Audits

on:
  pull_request: {}

jobs:
  audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run audit:parity
      - run: npm run audit:quiz
      - run: npm run audit:terminal
      - run: npm run audit:links
      - run: npm run build
