name: Operations report

# Monthly self-monitoring report. Summarises the previous month's autonomous
# runs, issues, PRs, and skill discoveries, then opens an informational issue
# and a draft blog post.
# BLUEPRINT: autonomous-content-ops-blueprint.md §3.6.

on:
  schedule:
    - cron: "0 9 1 * *" # 09:00 UTC on the 1st of each month
  workflow_dispatch: {}

concurrency:
  group: ops-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Configure git identity for automated commits
        run: |
          git config user.name "claude-code-learn-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Generate operations report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/ops-report.ts
      - name: Open or update a tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🔴 ${{ github.workflow }} failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Run failed: $RUN_URL
          Commit: ${{ github.sha }}
          Triggered by: ${{ github.event_name }}"
          EXISTING=$(gh issue list --label "automation-failure" --state open --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "automation-failure" --body "$BODY"
          fi
