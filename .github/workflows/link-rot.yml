name: Link rot

# Weekly external link guardian. A link must fail in two consecutive runs
# before it is declared dead. Confirmed dead links are auto-replaced if an
# official redirect is known; otherwise an issue is opened.
# BLUEPRINT: autonomous-content-ops-blueprint.md §3.3.

on:
  schedule:
    - cron: "0 6 * * 0" # 06:00 UTC every Sunday
  workflow_dispatch: {}

concurrency:
  group: link-rot
  cancel-in-progress: false

jobs:
  link-rot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Configure git identity for automated commits
        run: |
          git config user.name "claude-code-learn-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Check and heal external links
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_INPUT_TOKENS: "50000"
          MAX_OUTPUT_TOKENS: "2048"
        run: npx tsx scripts/audits/link-rot.ts
      - name: Open or update a tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🔴 ${{ github.workflow }} failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Run failed: $RUN_URL
          Commit: ${{ github.sha }}
          Triggered by: ${{ github.event_name }}"
          EXISTING=$(gh issue list --label "automation-failure" --state open --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "automation-failure" --body "$BODY"
          fi
