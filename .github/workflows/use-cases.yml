name: Use-case content update

# Weekly research and update of professional use-case guides. Fetches curated
# sources, asks Claude to compare them against existing guides, and publishes
# automatically if the full verification suite passes.

on:
  schedule:
    - cron: "0 5 * * 1" # 05:00 UTC every Monday
  workflow_dispatch: {}

concurrency:
  group: use-cases-content
  cancel-in-progress: false

jobs:
  use-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # actions: write lets _auto-publish.ts trigger deploy.yml directly — pushes made
      # with GITHUB_TOKEN don't fire other workflows' `on: push` triggers.
      actions: write
      # issues: write is for the failure-tracking step at the end of this job.
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Configure git identity for automated commits
        run: |
          git config user.name "claude-code-learn-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Research and update use-cases
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/use-cases/run.ts
      - name: Open or update a tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🔴 ${{ github.workflow }} failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Run failed: $RUN_URL
          Commit: ${{ github.sha }}
          Triggered by: ${{ github.event_name }}"
          EXISTING=$(gh issue list --label "automation-failure" --state open --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label "automation-failure" --body "$BODY"
          fi
