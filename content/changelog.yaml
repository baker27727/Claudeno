- id: "2.1.237"
  version: "2.1.237"
  date: "2026-08-20"
  entry:
    en: "Fixed prompt caching for sessions using an LLM gateway or custom base URL.
      Added a built-in \"Concise\" output style: Claude leads with results and
      skips preamble and narration, while doing the work just as thoroughly.
      Select it under Output style in /config."
    no: "Fikset prompt-caching for økter som bruker en LLM-gateway eller tilpasset
      basis-URL. Lagt til en innebygd \"Concise\"-utdatastil: Claude presenterer
      resultater først og hopper over innledning og forklaring, mens arbeidet
      blir gjort like grundig. Velg den under Output style i /config."
  sources: []
- id: "2.1.235"
  version: "2.1.235"
  date: "2026-08-19"
  entry:
    en: "Added optional `spellcheck` setting. Fixed prompt input highlights, slash
      commands in mid-response, permission dialogs, task list collapsing, and
      Shift+Tab in permission prompts. Improved permission dialogs consistency,
      memory/CPU usage in background cloud sessions, Vim mode transcript toggle
      preservation, dialog key selection responsiveness, and context-limit error
      messaging. Enhanced `/permissions` to open mid-turn and grid embedded grep
      performance. Preserved NORMAL mode and cursor position in Vim when
      toggling transcript or closing panels."
    no: "La til valgfri `spellcheck`-innstilling. Rettet ledetekstmarkering,
      slash-kommandoer i mid-respons, tillatelsesvinduer, oppgavelistesammenfall
      og Shift+Tab i tillatelsesprompter. Forbedret
      tillatelsesvinduer-konsistens, minne-/CPU-bruk i bakgrunnskysesjonger,
      Vim-modus transkripsjonsveksling, dialogtastvalg-respons og feilmelding på
      kontekstgrense. Forbedret `/permissions` for å åpne mid-turn og ytelse på
      innebygd grep. Bevart NORMAL-modus og marørposisjon i Vim når du veksler
      transkripsjon eller lukker paneler."
  sources: []
- id: "2.1.234"
  version: "2.1.234"
  date: "2026-08-18"
  entry:
    en: "Added optional CLAUDE_CODE_PROJECT_DIR_NAME environment variable for
      per-project transcript directory naming. Added selection:clear keybinding
      action. Added GitLab merge request badge support. Sessions now
      auto-continue when usage limits reset (configurable in /config). Improved
      session email handling and security hardening for Windows NT-namespace
      paths. Fixed numerous session restoration, permission prompt, markdown
      rendering, and shell command handling issues."
    no: "La til valgfri CLAUDE_CODE_PROJECT_DIR_NAME miljøvariabel for navngiving av
      katalog per prosjekt. La til selection:clear tastaturbinding-handling. La
      til GitLab merge request-merke-støtte. Økter fortsetter nå automatisk når
      bruksgrenser tilbakestilles (kan konfigureres i /config). Forbedret
      e-posthåndtering for økter og sikkerhetsherdning for Windows
      NT-navneromsbaner. Fikset mange problemer med øktsettelse,
      tillatelsesmeldinger, rendring av markdown og håndtering av
      shell-kommandoer."
  sources: []
- id: "2.1.233"
  version: "2.1.233"
  date: "2026-08-15"
  entry:
    en: "Version 2.1.233 adds GitLab merge request URL support to --worktree and
      claude agents view, introduces opt-in user identity forwarding for apps
      gateways, adds memory and cache TTL configuration for Bash tools and
      WebFetch, improves screen reader mode accessibility, and fixes issues with
      MCP v2 streams, permission prompts, CPU usage on Linux, skill command
      shadowing, argument substitution, Windows path validation, and Bash
      permission checks."
    no: "Versjon 2.1.233 legger til GitLab merge request-URL-støtte for --worktree
      og claude agents-visning, introduserer frivillig
      brukeridentitetsvideresendig for apps gateways, legger til minne- og
      buffer TTL-konfigurasjon for Bash-verktøy og WebFetch, forbedrer
      tilgjengeligheten til skjermleser-modus, og fikser problemer med MCP
      v2-strømmer, tillatelsesmeldinger, CPU-bruk på Linux,
      skill-kommandoskygger, argumentutvidelse og Windows-stiversvalidering."
  sources: []
- id: "2.1.232"
  version: "2.1.232"
  date: "2026-08-14"
  entry:
    en: "Subagent forking enabled by default with automatic prompt cache
      inheritance; cross-session messaging via `@` mention and `SendMessage`;
      GitLab marketplace and token redaction support; session name uniqueness
      enforcement; `/config` rows for dialog expiry and inbound message
      handling; numerous fixes for Remote Control, gateway policies, sandbox
      hardening, and UI responsiveness."
    no: "Underagent-forgrening aktivert som standard med automatisk arving av
      ledetekst-cache; meldinger på tvers av økter via `@`-nevning og
      `SendMessage`; GitLab-markedsplass- og token-redigeringsstøtte;
      håndhevelse av økt-navnuniqueness; `/config`-rader for dialogutløp og
      innkommende meldingshåndtering; mange fikser for Remote Control,
      gateway-retningslinjer, sandkasse-hardening og UI-responsivitet."
  sources: []
- id: "2.1.229"
  version: "2.1.229"
  date: "2026-08-13"
  entry:
    en: "Claude Code 2.1.229 adds `claude remote-control --continue` for resuming
      sessions, extends hook support to self-hosted runners, improves security
      by requiring explicit confirmation for dangerous git commands in
      `/commit-push-pr`, and fixes multiple issues including streaming response
      display, tool call crashes, terminal rendering in narrow windows, file
      path handling on Windows, MCP OAuth, Remote Control UI, GitHub workflow
      completion, performance stalls, plugin cleanup, workflow CPU limits,
      file-watcher leaks, SDK/stream-json errors, conversation compaction,
      OpenTelemetry export, managed-MCP server handling, Git Credential Manager
      timeouts, and more."
    no: "Claude Code 2.1.229 legger til `claude remote-control --continue` for å
      gjenoppta økter, utvider hook-støtte til self-hosted runners, forbedrer
      sikkerhet ved å kreve eksplisitt bekreftelse for farlige git-kommandoer i
      `/commit-push-pr`, og fikser flere problemer inkludert visning av
      streaming-respons, verktøy-kall-krasj, terminalrendering i smale vinduer,
      filstisøkning på Windows, MCP OAuth, Remote Control-brukergrensesnitt,
      GitHub-arbeidsflyt-fullføring, ytelseslammer, plugin-opprydding,
      arbeidsflyt-CPU-grenser, filovervåking-lekkasjer, SDK/stream-json-feil,
      samtalekomprimering, OpenTelemetry-eksport, administrert
      MCP-serverhåndtering, Git Credential Manager-tidsavbrudd og mer."
  sources: []
- id: "2.1.228"
  version: "2.1.228"
  date: "2026-08-12"
  entry:
    en: "**2.1.228:** Critical bug fixes for interactive sessions, Git/Git Bash
      detection on Windows, TUI model persistence, session messaging, remote
      control resume leaks, self-hosted runner reliability, session cleanup,
      settings merges, plugin caching, and skill syncing. Improved cross-session
      messaging display, Vertex AI credentials handling, compaction progress
      visibility, terminal title stability. Changed Write tool permissions to
      match Edit tool rules and removed outdated Pro/Max/Team auto-mode pricing
      note."
    no: "**2.1.228:** Kritiske feilrettinger for interaktive økter, Git/Git
      Bash-deteksjon på Windows, TUI-modellpersistens, øktmeldinger, Remote
      Control-resume-lekker, self-hosted runner-pålitelighet, øktopprydding,
      innstillingssammenslåinger, plugin-bufring og skill-synkronisering.
      Forbedret visning av meldinger på tvers av økter, Vertex
      AI-legitimasjonshåndtering, synlighet av kompakteringsfremgang,
      terminalkatstabilitet. Endret Write-verktøytillatelser for å matche
      Edit-verktøyreglene og fjernet utdatert Pro/Max/Team auto-mode-prisnotat."
  sources: []
- id: "2.1.227"
  version: "2.1.227"
  date: "2026-08-11"
  entry:
    en: "Fixed feature flags evaluation with expired login tokens, Bash command
      failures under claude-code-action with allowed_non_write_users, and /tui
      conversation rewind. Improved slash-command menu styling (blue selection,
      bolded matches, emoji preservation) and performance (fewer event-loop
      stalls)."
    no: "Fikset evaluering av funksjonflagg med utløpte innloggingstokener,
      Bash-kommandofeil under claude-code-action med allowed_non_write_users, og
      /tui-samtaletilbakespoling. Forbedret slash-kommandomenystil (blå utvalg,
      uthevet matching, emoji-bevaring) og ytelse (færre event-loop-stopp)."
  sources: []
- id: "2.1.226"
  version: "2.1.226"
  date: "2026-08-08"
  entry:
    en: "Bug fixes and reliability improvements"
    no: "Feilrettinger og pålitelighetsforbedringar"
  sources: []
- id: "2.1.224"
  version: "2.1.224"
  date: "2026-08-07"
  entry:
    en: "Added self-hosted environments, archive plugin source, cross-session
      messaging, expanded sandbox credential-masking, and several bug fixes
      including session isolation, RemoteControl reliability, and paste content
      handling."
    no: "Lagt til selvhoste-miljøer, arkiv-plugin-kilde, meldingsutveksling på tvers
      av økter, utvidet sandkasse-legitimasjonsskjerming, og flere feilrettinger
      inkludert ØKT-isolasjon, RemoteControl-pålitelighet og håndtering av
      limeavsnitt-innhold."
  sources: []
- id: "2.1.223"
  version: "2.1.223"
  date: "2026-08-06"
  entry:
    en: "Version 2.1.223 adds owner wildcard support for managed marketplace
      settings, strengthens permission validation to prevent command
      obfuscation, introduces the `/teleport` hint for cloud-to-local session
      transitions, and includes numerous security and stability fixes."
    no: "Versjon 2.1.223 legger til eierjokertstøtte for administrerte
      markedplassinnstillinger, styrker tillatelsevalidering for å forhindre
      kommandoforklaring, introduserer `/teleport`-hinten for økt-overganger fra
      sky til lokal, og inkluderer flere sikkerhets- og
      stabilitetsforbedringer."
  sources: []
- id: "2.1.222"
  version: "2.1.222"
  date: "2026-08-05"
  entry:
    en: "Version 2.1.222 brings critical security and isolation improvements:
      worktree-isolated sessions now prevent destructive git commands, auto-mode
      permission checks now evaluate SendMessage dispatch, PreToolUse hooks no
      longer bypass tool restrictions, and the startup connectivity check works
      reliably behind HTTPS proxies. Multiple usage, session, and display fixes
      improve accuracy of credit attribution, PR linking, and subagent effort
      reporting."
    no: "Versjon 2.1.222 bringer kritiske sikkerhet- og isolasjonsforbedringer:
      worktree-isolert økter forhindrer nå destruktive git-kommandoer,
      auto-modustillatelsessjekker evaluerer nå SendMessage-avsending,
      PreToolUse-hooks omgår ikke lenger verktøybegrensninger, og
      oppstartsforbindelsesjekken fungerer pålitelig bak HTTPS-proxyobjekter.
      Flere bruksomfatting-, økt- og visningsfiks forbedrer nøyaktigheten av
      kredittattribusjon, PR-kobling og rapportering av underagentinnsats."
  sources: []
- id: "2.1.221"
  version: "2.1.221"
  date: "2026-08-04"
  entry:
    en: "Version 2.1.221 introduces the Focus view for VSCode, adds `mode: \"mask\"`
      for sandbox credentials on Linux/WSL, improves MCP server handling and
      plugin installation, and includes numerous bug fixes for permission
      checks, session handling, API requests, and authentication workflows."
    no: "Versjon 2.1.221 introduserer Focus-visningen for VSCode, legger til `mode:
      \"mask\"` for sandkasse-legitimasjon på Linux/WSL, forbedrer
      MCP-tjener-håndtering og plugin-installasjon, og inkluderer tallrike
      feilrettinger for tillatelseskontroller, økthåndtering, API-forespørsler
      og autentiseringsarbeidsflyten."
  sources: []
- id: "2.1.220"
  version: "2.1.220"
  date: "2026-07-26"
  entry:
    en: "Bug fixes and reliability improvements. Subagents can now spawn nested
      subagents up to depth 3 by default; spawn cap and nesting depth are now
      configurable via environment variables. New
      `sandbox.network.strictAllowlist` setting for stricter network isolation."
    no: "Feilrettinger og pålitelighetsforbedringer. Underagenter kan nå spawne
      nestede underagenter inntil dybde 3 som standard; spawning-grensen og
      nestingsdybden er nå konfigurerbar via miljøvariabler. Ny innstilling
      `sandbox.network.strictAllowlist` for strengere nettverksisolering."
  sources: []
- id: "2.1.218"
  version: "2.1.218"
  date: "2026-07-23"
  entry:
    en: "Version 2.1.218 introduces background subagent processing for
      `/code-review` and new spawn caps for subagent delegation, along with
      improvements to `/ultrareview` error handling and screen reader
      accessibility. Added `sandbox.filesystem.disabled` setting and emoji
      shortcode autocomplete. Fixed multiple bugs including Windows path
      corruption, stale token reporting, and multi-line paste handling."
    no: "Versjon 2.1.218 introduserer bakgrunnsprosessering av underagenter for
      `/code-review` og nye spawning-grenser for underagentdelegering, sammen
      med forbedringer til `/ultrareview`-feilbehandling og tilgjengelighet for
      skjermlesere. La til `sandbox.filesystem.disabled`-innstilling og
      emoji-forkortelsesautofullføring. Fikset flere feil inkludert
      Windows-stikørrupsjon, foreldet token-rapportering og håndtering av
      flerlinjepasta."
  sources: []
- id: "2.1.217"
  version: "2.1.217"
  date: "2026-07-22"
  entry:
    en: "Claude Code 2.1.217 adds emoji shortcode autocomplete, improves transcript
      write warnings, fixes memory leaks in tool truncation, resolves Windows
      auto-update issues, and introduces spawn caps for subagents to prevent
      unbounded delegation. Screen reader mode stability improvements, remote
      session reliability fixes, and proper enforcement of corporate security
      settings (mTLS, TLS-verify, OAuth, proxy) are also included."
    no: "Claude Code 2.1.217 legger til emoji-forkortelsesautofullføring, forbedrer
      varslinger for utskriftsskriving, fikser minnelekkasjer ved
      verktøytrunkering, løser Windows-oppdateringsproblemer, og introduserer
      spawning-grenser for underagenter for å forhindre ubegrenset delegering.
      Forbedringer av skjermleser-modussstabilitet, pålitelighetsreparasjoner
      for eksterne økter, og riktig håndhevelse av bedriftsikkerhetinnstillinger
      (mTLS, TLS-verify, OAuth, proxy) er også inkludert."
  sources: []
- id: "2.1.216"
  version: "2.1.216"
  date: "2026-07-21"
  entry:
    en: "Added sandbox.filesystem.disabled setting to skip filesystem isolation
      while keeping network egress control. Fixed background sessions reverting
      to default agent configuration on resume. Fixed background subagents
      getting cancelled during startup and worktree isolation issues. Improved
      permission prompt handling and OTel metrics reporting."
    no: "Lagt til sandbox.filesystem.disabled-innstilling for å hoppe over
      filsystemisolering mens nettverkskontroll opprettholdes. Fikset at
      bakgrunnsøkter gjenopprettes med standardagent-konfigurasjon. Fikset at
      bakgrunds-underagenter blir annullert under oppstart og
      worktree-isolasjonsproblemer. Forbedret håndtering av tillatelsesprompt og
      OTel-metrikker."
  sources: []
- id: "2.1.215"
  version: "2.1.215"
  date: "2026-07-19"
  entry:
    en: "Claude no longer runs the `/verify` and `/code-review` skills on its own;
      invoke them with `/verify` or `/code-review` when you want them"
    no: "Claude kjører ikke lenger `/verify` og `/code-review` skills automatisk;
      påkall dem med `/verify` eller `/code-review` når du ønsker det"
  sources: []
- id: "2.1.214"
  version: "2.1.214"
  date: "2026-07-18"
  entry:
    en: "Claude Code 2.1.214 improves permission checks for `dir/**` rules and
      `docker` commands, clarifies SessionStart hook reporting, and fixes
      multiple Bash, PowerShell, and background session issues. See 2.1.212
      release notes for `/fork` redesign and spawn cap limits."
    no: "Claude Code 2.1.214 forbedrer tillatelseskontroller for `dir/**`-regler og
      `docker`-kommandoer, tydeliggjør SessionStart-hook-rapportering og fikser
      flere Bash-, PowerShell- og bakgrunnsøktproblemer. Se 2.1.212
      utgivelsesnotater for `/fork`-redesign og spawning-grensebegrensninger."
  sources: []
- id: "2.1.212"
  version: "2.1.212"
  date: "2026-07-17"
  entry:
    en: "Slash command changes: `/fork` now creates background sessions, `/resume`
      opens a session picker, `/subtask` replaces inline subagent launching. New
      controls: `claude auto-mode reset`, WebSearch rate limiting, MCP
      auto-background tool handling, per-session subagent spawn caps. Numerous
      bug fixes including plan mode permission prompts, symlink worktree
      creation, shell mode autocomplete, `/ultrareview` branch handling, hosted
      session startup, and streaming-mode request tracking."
    no: "Slash-kommando-endringer: `/fork` oppretter nå bakgrunnsøkter, `/resume`
      åpner en session-velger, `/subtask` erstatter inline underagent-oppstart.
      Nye kontroller: `claude auto-mode reset`, WebSearch-ratebegrensning, MCP
      auto-bakgrunn-verktøyhåndtering, per-økt subagent-spawning-begrensninger.
      Flere feilrettinger inkludert planleggingsmodus tillatelser-ledetekster,
      symlink-worktree-opprettelse, shell-modus autofullføring, `/ultrareview`
      branch-håndtering, hosted session-oppstart, og
      streaming-mode-forespørselssporing."
  sources: []
- id: "2.1.211"
  version: "2.1.211"
  date: "2026-07-16"
  entry:
    en: "Claude Code 2.1.211 adds stream-json enhancements with
      `--forward-subagent-text`, improves accessibility with screen reader mode,
      hardens permission previews, and fixes numerous issues including hook
      decision handling, auto-mode behavior, file uploads, subagent resumption,
      and background session stability."
    no: "Claude Code 2.1.211 legger til stream-json-forbedringer med
      `--forward-subagent-text`, forbedrer tilgjengelighet med
      skjermleser-modus, styrker tillatelsesoversikter, og fikser numerous
      problemer inkludert hook-beslutningshåndtering, auto-modusoppførselen,
      filiopplastinger, underagent-gjenopptakelse, og bakgrunnssøkt-stabilitet."
  sources: []
- id: "2.1.210"
  version: "2.1.210"
  date: "2026-07-15"
  entry:
    en: "Claude Code 2.1.210 adds a live elapsed-time counter to tool summaries for
      better visibility of long-running operations, introduces startup warnings
      for deprecated permission rules, and fixes numerous issues including
      subagent isolation, session crashes, permission handling, and background
      worker stability."
    no: "Claude Code 2.1.210 legger til en live telleren for forløpt tid i
      verktøysammendrag for bedre synlighet av langvarige operasjoner,
      introduserer oppstartadvarsler for foreldet tillatelsesamfunger, og fikser
      mange problemer inkludert underagent-isolering, øktkrasj,
      tillatelsesbhandling og stabilitet for bakgrunnsarbeidere."
  sources: []
- id: "2.1.209"
  version: "2.1.209"
  date: "2026-07-14"
  entry:
    en: "Fixed /model and other dialogs being blocked in `claude agents` background
      sessions (reverts an overly broad guard). This release also includes all
      improvements from 2.1.208 and 2.1.207, including screen reader mode, vim
      insert mode remaps, and CLAUDE_CODE_PROCESS_WRAPPER environment variable
      support."
    no: "Fikset /model og andre dialogbokser som ble blokkert i `claude agents`
      bakgrunnsokteer (tilbakefører en altfor bred vakt). Denne utgivelsen
      inkluderer også alle forbedringer fra 2.1.208 og 2.1.207, inkludert
      skjermleseromodus, vim insert mode remaps, og støtte for
      CLAUDE_CODE_PROCESS_WRAPPER miljøvariabel."
  sources: []
- id: "2.1.207"
  version: "2.1.207"
  date: "2026-07-11"
  entry:
    en: "Auto mode is now available by default on Bedrock, Vertex AI, and Foundry
      (disable via `disableAutoMode` in settings). Fixed multiple issues
      including terminal responsiveness with long outputs, auto-updater
      conflicts with custom launchers, transcript scrolling glitches, and
      security issues with malformed glob patterns and shell injection
      vulnerabilities in plugin hooks."
    no: "Automodus er nå tilgjengelig som standard på Bedrock, Vertex AI og Foundry
      (deaktiver via `disableAutoMode` i innstillinger). Fikset flere problemer
      inkludert terminalresponsivitet med lange resultater, konflikter mellom
      auto-oppdaterer og egendefinerte startere, glitcher i avskriftsrulling, og
      sikkerhetsproblemer med malformerte glob-mønster og
      shell-injeksjonssårbarheter i plugin-hooks."
  sources: []
- id: "2.1.206"
  version: "2.1.206"
  date: "2026-07-10"
  entry:
    en: "Added directory path suggestions to `/cd` and expanded `/doctor` into a
      full setup checkup; `/commit-push-pr` now auto-allows git push to the
      configured push remote; `/login` supports Anthropic-operated gateway
      endpoints. Background agents now upgrade immediately after Claude Code
      updates. MCP servers properly respect per-server request timeout settings.
      Fixed multiple critical issues in subagents, authentication, and MCP
      server connectivity."
    no: "La til katalogveistøtte til `/cd` og utvidet `/doctor` til en full
      oppsettskontroll; `/commit-push-pr` tillater nå automatisk git push til
      den konfigurerte push-fjernkilden; `/login` støtter Anthropic-drivne
      gateway-endepunkter. Underagenter oppgraderes nå umiddelbart etter Claude
      Code-oppdateringer. MCP-tjenere respekterer nå korrekt per-tjener
      timeout-innstillinger for forespørsler. Fikset flere kritiske problemer i
      underagenter, autentisering og MCP-tjener-tilkobling."
  sources: []
- id: "2.1.205"
  version: "2.1.205"
  date: "2026-07-09"
  entry:
    en: "Claude Code now includes an auto mode rule that blocks tampering with
      session transcript files. The /doctor command is a full setup checkup that
      can diagnose and fix issues (with /checkup as an alias). Numerous fixes
      address background agent stability, session linking, worktree handling,
      and the agent view display. Binary downloads now stream to disk instead of
      buffering in memory, reducing peak memory usage."
    no: "Claude Code inkluderer nå en auto-mode-regel som blokkerer manipulering av
      økt-transkripsjonsfiler. Kommandoen /doctor er en fullstendig
      oppsettkontroll som kan diagnostisere og fikse problemer (med /checkup som
      alias). Mange fikser adresserer bakgrunnsagent-stabilitet, økt-lenking,
      worktree-håndtering og agentvisningen. Binære nedlastinger strømmer nå til
      disk i stedet for å bufres i minnet, noe som reduserer toppminnbruk."
  sources: []
- id: "2.1.204"
  version: "2.1.204"
  date: "2026-07-08"
  entry:
    en: "Fixed hook events (including SessionStart hooks) not streaming during
      headless sessions, which could cause remote workers to be idle-reaped
      mid-hook."
    no: "Rettet en feil der hook-hendelser (inkludert SessionStart-hooks) ikke ble
      strømmet under hodeløse økter, noe som kunne føre til at eksterne
      arbeidsprosesser ble avsluttet som inaktive midt i en hook."
  sources: []
- id: "2.1.0"
  version: "2.1.0"
  date: "2026-07-06"
  entry:
    en: "Initial platform launch covering Claude Code 2.1.0."
    no: "Første lansering av plattformen som dekker Claude Code 2.1.0."
  sources:
    - "https://github.com/anthropics/claude-code"
